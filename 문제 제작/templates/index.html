<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Network Diagnostic Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 전체 다크 테마 배경 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 상단 네비게이션 바 */
        .header {
            width: 100%;
            background-color: #1e293b;
            padding: 20px 0;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid #0369a1;
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 650px;
            background-color: #1e293b;
            margin-top: 50px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h2 { margin-top: 0; color: #f8fafc; font-size: 22px; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }

        /* 입력 폼 묶음 */
        .input-group {
            display: flex;
            gap: 10px;
        }

        /* 입력창 디자인 */
        input[type="text"] {
            flex: 1;
            padding: 14px 15px;
            font-size: 16px;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Fira Code', monospace;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* 전송 버튼 디자인 */
        button {
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover { background-color: #0369a1; }

        /* 결과 창 구분선 */
        .result-section {
            margin-top: 40px;
            border-top: 1px solid #334155;
            padding-top: 25px;
        }

        .result-title {
            color: #f8fafc;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .cmd-text {
            color: #ef4444; 
            font-family: 'Fira Code', monospace;
            background: #292524;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .terminal {
            background-color: #000000;
            color: #22c55e; /* 네온 그린 */
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            overflow-x: auto;
            font-family: 'Fira Code', monospace; 
            font-size: 14px;
            line-height: 1.6;
            box-shadow: inset 0 0 15px rgba(0, 255, 0, 0.05);
            border: 1px solid #14532d;
        }
        
        .terminal pre { margin: 0; }
    </style>
</head>
<body>

    <div class="header">System Admin | Diagnostics</div>
    
    <div class="container">
        <h2>Ping Test Utility</h2>
        <p>서버의 네트워크 연결 상태를 확인하기 위해 대상 IP 주소 또는 도메인을 입력하십시오. <br><small>(예: 8.8.8.8 또는 google.com)</small></p>
        
        <form method="POST">
            <div class="input-group">
                <input type="text" name="host" placeholder="Enter IP address..." required autocomplete="off">
                <button type="submit">Execute</button>
            </div>
        </form>
        
        <!-- 서버로부터 data(결과값)를 받았을 때만 아래 영역이 표시됨 -->
        {% if data %}
        <div class="result-section">
            <div class="result-title">Execution Result:</div>
            <p style="font-size: 13px; color: #94a3b8; margin-top: 5px;">
                Executed Command: <span class="cmd-text">{{ cmd }}</span>
            </p>
            
            <div class="terminal">
                <pre>{{ data }}</pre>
            </div>
        </div>
        {% endif %}
    </div>

</body>
</html>
