<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #334155; }
        .header h1 { margin: 0; font-size: 24px; color: #38bdf8; }
        .logout-btn { color: #f87171; text-decoration: none; font-weight: bold; padding: 8px 16px; border: 1px solid #7f1d1d; border-radius: 6px; transition: all 0.3s; }
        .logout-btn:hover { background-color: #450a0a; }

        .dashboard-card { background-color: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); border: 1px solid #334155; width: 100%; max-width: 800px; box-sizing: border-box; }
        .dashboard-card h2 { margin-top: 0; color: #f8fafc; font-size: 20px; margin-bottom: 10px; }
        .dashboard-card p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; }
        
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 14px 15px; font-size: 15px; background-color: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 6px; outline: none; transition: border-color 0.3s; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { padding: 0 25px; font-size: 15px; font-weight: bold; background-color: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚙️ Admin Dashboard</h1>
        <a href="/logout" class="logout-btn">로그아웃</a>
    </div>
    
    <div class="dashboard-card">
        <h2>프로필 환경 설정</h2>
        <p>환영합니다, 관리자님. 시스템에 표시될 닉네임을 설정해주세요.</p>
        
        <!-- 이곳이 SSTI 공격을 시도할 폼입니다 -->
        <form method="POST" action="/dashboard">
            <div class="input-group">
                <input type="text" name="nickname" placeholder="새로운 닉네임을 입력하세요 (예: Master)" required autocomplete="off">
                <button type="submit">설정 적용</button>
            </div>
        </form>
    </div>

</body>
</html>
