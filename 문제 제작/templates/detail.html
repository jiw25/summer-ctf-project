<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ book.title }} - 도서 상세</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 30px; align-items: center;}
        
        .info-top { display: flex; gap: 40px; }
        .book-cover { width: 220px; height: 320px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0;}
        .book-cover img { width: 100%; height: 100%; object-fit: contain; padding: 10px;}
        
        .info-center { flex: 1; }
        .title-text { font-size: 32px; font-weight: bold; color: #1e3a8a; margin-top: 10px; margin-bottom: 10px; }
        .author-text { font-size: 18px; color: #64748b; margin-bottom: 20px; }
        .callnum-badge { display: inline-block; padding: 8px 16px; background: #f1f5f9; color: #334155; font-family: monospace; font-size: 14px; font-weight: bold; border-radius: 6px; margin-bottom: 20px; border: 1px solid #cbd5e1;}
        
        .story-box { background: #f8fafc; padding: 25px; border-radius: 10px; font-size: 15px; color: #475569; line-height: 1.6; border: 1px solid #e2e8f0;}
        .story-box h4 { margin-top: 0; color: #334155; }
        
        /* 관리자용 편집 폼 (SSTI 취약점) */
        .admin-edit-box { background: #fff1f2; padding: 20px; border-radius: 10px; border: 2px dashed #f43f5e; margin-top: 30px; }
        .admin-edit-box h3 { margin-top: 0; color: #be123c; display: flex; align-items: center; gap: 8px;}
        textarea { width: 100%; height: 120px; padding: 15px; border: 1px solid #fda4af; border-radius: 6px; box-sizing: border-box; resize: vertical; margin-bottom: 10px; background: #fffbfa;}
        .btn-save { background: #e11d48; color: white; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-save:hover { background: #be123c; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="margin: 0; color: #1e3a8a;">도서 상세 정보</h2>
            <a href="/" style="color: #64748b; text-decoration: none; font-weight: bold;">← 메인으로</a>
        </div>

        <div class="info-top">
            <div class="book-cover">
                <img src="{{ book.img }}" alt="도서 표지">
            </div>
            
            <div class="info-center">
                <div class="title-text">{{ book.title }}</div>
                <div class="author-text">저자: {{ book.author }}</div>
                <div class="callnum-badge">청구기호: {{ book.call_num }}</div>
                
                <div class="story-box">
                    <h4>📖 줄거리</h4>
                    {{ book.story }}
                </div>

                <!-- 🚨 관리자(Admin) 권한이 있을 때만 아래 편집창이 나타납니다! 🚨 -->
                {% if session.get('role') == 'admin' %}
                <div class="admin-edit-box">
                    <h3>🛠️ 사서 전용 데이터 수정 (Admin Only)</h3>
                    <p style="font-size: 13px; color: #9f1239; margin-bottom: 15px;">
                        [System] 현재 이 시스템은 Jinja2 템플릿 엔진을 사용하여 데이터를 렌더링하고 있습니다.<br>
                        도서 정보 수정 시 시스템 코드가 손상되지 않도록 주의하십시오.
                    </p>
                    <form method="POST" action="/detail/{{ book.id }}">
                        <textarea name="story" placeholder="수정할 줄거리 내용을 입력하세요 (템플릿 문법 지원됨)...">{{ book.story }}</textarea>
                        <button type="submit" class="btn-save">줄거리 수정 적용</button>
                    </form>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
