<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .login-box { background-color: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; width: 100%; max-width: 350px; }
        .login-box h2 { margin-top: 0; color: #38bdf8; text-align: center; font-size: 24px; margin-bottom: 10px; }
        .login-box p { color: #94a3b8; text-align: center; font-size: 14px; margin-bottom: 30px; }
        
        .error-msg { background-color: #450a0a; color: #f87171; padding: 10px; border-radius: 6px; font-size: 14px; text-align: center; margin-bottom: 20px; border: 1px solid #7f1d1d; }

        .input-group { margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 14px 15px; font-size: 15px; background-color: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 6px; outline: none; box-sizing: border-box; transition: border-color 0.3s; margin-bottom: 15px; }
        .input-group input:focus { border-color: #38bdf8; }
        
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background-color: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #0369a1; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #e2e8f0; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔒 System Login</h2>
        <p>관리자 전용 접근 페이지입니다.</p>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username (아이디)" required autocomplete="off">
                <input type="password" name="password" placeholder="Password (비밀번호)" required>
            </div>
            <button type="submit">로그인</button>
        </form>
        
        <a href="/" class="back-link">← 통합 검색으로 돌아가기</a>
    </div>

</body>
</html>
