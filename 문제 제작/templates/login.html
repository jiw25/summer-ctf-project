<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사서 포털 로그인 -  중앙 도서관</title>
    <link href="https://fonts.googleapis.com/css2?family=Malgun+Gothic&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #0f172a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #e2e8f0; }
        .login-wrapper { display: flex; flex-direction: column; align-items: center; }
        
        .login-box { background: #1e293b; padding: 40px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        h2 { color: #38bdf8; margin-top: 0; margin-bottom: 5px; font-size: 24px; letter-spacing: 1px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 14px; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; background: #0f172a; color: white; font-size: 15px; transition: border-color 0.3s, box-shadow 0.3s; outline: none; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1); }
        
        button { width: 100%; padding: 14px; background: #2563eb; color: white; font-weight: bold; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: background 0.3s; margin-top: 10px; letter-spacing: 1px; }
        button:hover { background: #1d4ed8; }
        
        .error-msg { background: #450a0a; color: #f87171; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; border: 1px solid #7f1d1d; }
        
        /* 스토리텔링용 경고 문구 */
        .warning-text { margin-top: 25px; font-size: 12px; color: #64748b; line-height: 1.5; text-align: left; background: #0f172a; padding: 10px; border-radius: 6px; border-left: 3px solid #ef4444; }
        .warning-text span { color: #ef4444; font-weight: bold; }
        
        /* 메인으로 돌아가기 버튼 */
        .back-link { margin-top: 30px; color: #64748b; text-decoration: none; font-size: 14px; transition: color 0.3s; font-weight: bold; }
        .back-link:hover { color: #f8fafc; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2>LIBRARIAN ACCESS</h2>
            <div class="subtitle">중앙 도서관 사서 전용 보안 포털</div>
            
            <!-- 로그인 실패 시 에러 메시지 -->
            {% if error %}
            <div class="error-msg">❌ {{ error }}</div>
            {% endif %}
            
            <form method="POST">
                <div class="input-group">
                    <input type="text" name="username" placeholder="아이디 (Admin ID)" required autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="보안 비밀번호 (Password)" required>
                </div>
                <button type="submit">시스템 로그인</button>
            </form>
            
            <!-- 해커(참가자)의 몰입을 돕는 경고 문구 -->
            <div class="warning-text">
                <span>[접근 경고]</span><br>인가되지 않은 사용자의 접근을 엄격히 금지합니다. 모든 로그인 시도는 IP와 함께 보안 로그에 기록됩니다.
            </div>
        </div>
        
        <a href="/" class="back-link">← 도서관 메인 검색창으로 돌아가기</a>
    </div>
</body>
</html>
